<!DOCTYPE html>

    <meta charset="UTF-8">

  <body>
  <!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>萬壑松風：流泉</title>

<style>
:root{
  --frame:#3e2723;
  --paper:#f3e5dc;
  --btn:rgba(62,39,35,0.30);
  --btnActive:rgba(62,39,35,0.65);
  --blue:#1565c0;
  --blue2:#0d47a1;
}

*{box-sizing:border-box;}
html,body{
  margin:0;
  height:100%;
  overflow:hidden;
  background:#4e342e;
  font-family:"Microsoft JhengHei",sans-serif;
  touch-action:none;
}

#gameWrap{
  position:fixed;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
}

#game{
  position:relative;
  width:100%;
  max-width:520px;
  height:100%;
  aspect-ratio:9/16;
  background:var(--paper);
  border:8px solid var(--frame);
  border-radius:18px;
  overflow:hidden;
}

canvas{
  width:100%;
  height:100%;
  display:block;
  background:var(--paper);
}

/* UI */
#ui{
  position:absolute;
  top:10px;
  left:10px;
  right:10px;
  display:flex;
  justify-content:space-between;
  z-index:10;
}

#scoreBox{
  background:rgba(255,255,255,0.85);
  padding:8px 14px;
  border-radius:12px;
  font-weight:900;
}

/* 控制 */
#controls{
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  padding:12px;
  display:flex;
  gap:10px;
  align-items:flex-end;
}

.ctrl{
  flex:1;
  height:64px;
  border-radius:16px;
  background:var(--btn);
  color:#fff;
  font-size:30px;
  font-weight:900;
  display:flex;
  justify-content:center;
  align-items:center;
}
.ctrl:active,.ctrl.hold{background:var(--btnActive);}

#side{
  display:flex;
  flex-direction:column;
  gap:8px;
  width:100px;
}
.sideBtn{
  height:40px;
  border:none;
  border-radius:12px;
  background:var(--blue);
  color:#fff;
  font-weight:900;
}
.sideBtn:active{background:var(--blue2);}

/* Modal */
.modal{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:85%;
  background:#fff;
  border-radius:16px;
  padding:20px;
  text-align:center;
  z-index:50;
}
.modal button{
  width:100%;
  height:50px;
  border:none;
  border-radius:14px;
  background:var(--blue);
  color:#fff;
  font-weight:900;
  font-size:18px;
}
#over{display:none;}
</style>
</head>

<body>
<div id="gameWrap">
<div id="game">

<canvas id="canvas"></canvas>

<div id="ui">
<div id="scoreBox">生機值：<span id="score">0</span></div>
</div>

<div id="controls">
<div id="left" class="ctrl">←</div>
<div id="side">
<button id="pause" class="sideBtn">暫停</button>
<button id="restart" class="sideBtn">重來</button>
</div>
<div id="right" class="ctrl">→</div>
</div>

<div id="start" class="modal">
<h2>萬壑松風：流泉</h2>
<p>按住 ← → 控制水流<br>避開岩石，經過松林加分</p>
<button id="startBtn">開始流淌</button>
</div>

<div id="over" class="modal">
<h2>水流阻斷</h2>
<p>最終生機：<span id="finalScore">0</span></p>
<button id="againBtn">重新發源</button>
</div>

</div>
</div>

<script>
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const wrapper=document.getElementById("game");

function resize(){
  const rect=wrapper.getBoundingClientRect();
  const dpr=Math.min(window.devicePixelRatio||1,3);
  canvas.width=rect.width*dpr;
  canvas.height=rect.height*dpr;
  canvas.style.width=rect.width+"px";
  canvas.style.height=rect.height+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener("resize",resize);
window.addEventListener("orientationchange",resize);
resize();

/* 遊戲變數 */
let state="START";
let score=0;
let speed=4;
let frame=0;

const player={x:0,y:0,r:9,trail:[]};
let rocks=[],pines=[];
const keys={l:false,r:false};

function init(){
  state="PLAYING";
  score=0; speed=4; frame=0;
  rocks=[]; pines=[];
  document.getElementById("score").textContent=0;
  document.getElementById("start").style.display="none";
  document.getElementById("over").style.display="none";

  const w=wrapper.clientWidth;
  const h=wrapper.clientHeight;
  player.x=w/2;
  player.y=h*0.75;
  player.trail=[];
  loop();
}

function spawn(){
  if(frame%50!==0)return;
  const w=wrapper.clientWidth;
  const type=Math.random();
  const x=Math.random()*(w-60)+30;
  if(type>0.4){
    rocks.push({x,y:-40,w:40,h:30});
  }else{
    pines.push({x,y:-40,col:false});
  }
}

function update(){
  if(state!=="PLAYING")return;
  frame++;

  const w=wrapper.clientWidth;
  const h=wrapper.clientHeight;

  if(keys.l)player.x-=5;
  if(keys.r)player.x+=5;
  player.x=Math.max(20,Math.min(w-20,player.x));

  player.trail.unshift({x:player.x,y:player.y});
  if(player.trail.length>80)player.trail.pop();
  for(const t of player.trail)t.y-=speed;

  spawn();

  for(let i=rocks.length-1;i>=0;i--){
    const r=rocks[i];
    r.y+=speed;
    const dx=player.x-r.x;
    const dy=player.y-r.y;
    if(Math.hypot(dx,dy)<20)gameOver();
    if(r.y>h+50)rocks.splice(i,1);
  }

  for(let i=pines.length-1;i>=0;i--){
    const p=pines[i];
    p.y+=speed;
    if(!p.col && Math.hypot(player.x-p.x,player.y-p.y)<30){
      p.col=true;
      score+=10;
      document.getElementById("score").textContent=score;
    }
    if(p.y>h+50)pines.splice(i,1);
  }
}

function draw(){
  const w=wrapper.clientWidth;
  const h=wrapper.clientHeight;
  ctx.clearRect(0,0,w,h);

  /* 山形背景 */
  ctx.fillStyle="#e6d6c8";
  ctx.beginPath();
  ctx.moveTo(0,h);
  ctx.lineTo(w*0.3,h*0.65);
  ctx.lineTo(w*0.6,h*0.75);
  ctx.lineTo(w,h*0.55);
  ctx.lineTo(w,h);
  ctx.closePath();
  ctx.fill();

  /* 水流 */
  if(player.trail.length>1){
    ctx.beginPath();
    ctx.moveTo(player.trail[0].x,player.trail[0].y);
    for(let t of player.trail)ctx.lineTo(t.x,t.y);
    ctx.strokeStyle="#29b6f6";
    ctx.lineWidth=10;
    ctx.lineCap="round";
    ctx.stroke();
  }

  /* 松林（三角） */
  for(const p of pines){
    ctx.fillStyle="#3e2723";
    ctx.fillRect(p.x-4,p.y,8,20);

    ctx.fillStyle=p.col?"#81c784":"#1b5e20";
    ctx.beginPath();
    ctx.moveTo(p.x,p.y-22);
    ctx.lineTo(p.x+20,p.y+10);
    ctx.lineTo(p.x-20,p.y+10);
    ctx.closePath();
    ctx.fill();
  }

  /* 岩石（多邊形） */
  for(const r of rocks){
    ctx.fillStyle="#212121";
    ctx.beginPath();
    ctx.moveTo(r.x,r.y-15);
    ctx.lineTo(r.x+20,r.y);
    ctx.lineTo(r.x+10,r.y+15);
    ctx.lineTo(r.x-20,r.y+15);
    ctx.lineTo(r.x-10,r.y);
    ctx.closePath();
    ctx.fill();
  }

  /* 玩家 */
  ctx.beginPath();
  ctx.arc(player.x,player.y,player.r,0,Math.PI*2);
  ctx.fillStyle="#fff";
  ctx.fill();
}

function gameOver(){
  state="OVER";
  document.getElementById("finalScore").textContent=score;
  document.getElementById("over").style.display="block";
}

function loop(){
  update();
  draw();
  if(state==="PLAYING")requestAnimationFrame(loop);
}

/* 控制 */
function hold(btn,key){
  btn.addEventListener("pointerdown",()=>{keys[key]=true;btn.classList.add("hold");});
  btn.addEventListener("pointerup",()=>{keys[key]=false;btn.classList.remove("hold");});
  btn.addEventListener("pointerleave",()=>{keys[key]=false;btn.classList.remove("hold");});
}
hold(document.getElementById("left"),"l");
hold(document.getElementById("right"),"r");

document.getElementById("startBtn").onclick=init;
document.getElementById("againBtn").onclick=init;
document.getElementById("restart").onclick=init;

document.getElementById("pause").onclick=()=>{
  if(state==="PLAYING"){state="PAUSE";}
  else if(state==="PAUSE"){state="PLAYING";loop();}
};
</script>
</body>
</html>
    
  </body>
  
</html>
